name: Core Bridge Frontend Build & Deploy to EC2 with Docker Compose

on:
  push:
    branches:
      - 'dev'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Node.js build ---
      - name: Set up Node.js 20.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install Frontend Dependencies
        working-directory: .
        run: npm ci

      - name: Build Frontend
        working-directory: .
        run: npm run build

      # --- Docker build ---

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/corebridge-frontend:${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/corebridge-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            echo "Success SSH connection"

            echo "move to /home/ubuntu/workspace/core-bridge"
            cd /home/ubuntu/workspace/core-bridge

            echo "Pulling Docker Image from DockerHub, Only Frontend"
            sudo docker compose pull frontend

            echo "Running Docker Container that is Frontend Service"
            sudo docker compose up -d --no-deps frontend

            echo "Cleaning up unused Docker images"
            sudo docker image prune -f

            echo "Deployment completed."
